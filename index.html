<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블루 아카이브 스토리 순서 가이드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#0a1730; --bg2:#10224a; --card:#132a57; --line:#24407a;
  --text:#e8eefc; --muted:#9fb1d6; --accent:#38b6ff; --accent2:#7fd3ff;
  --red:#ff5d73; --yellow:#ffcc4d; --gray:#7d8db0; --done:#2ecc8f;
}
[data-theme="light"]{
  --bg:#f3f7ff; --bg2:#e6eefc; --card:#ffffff; --line:#cfdcf3;
  --text:#132344; --muted:#5a6d92; --accent:#128fe0; --accent2:#0a6fb3;
  --gray:#8d9bb8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .2s,color .2s}
a{color:var(--accent2)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 120px}
header{padding:48px 0 24px;position:relative}
header .badge{display:inline-block;font-size:12px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 10px;margin-bottom:12px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 6px;line-height:1.25}
.sub{color:var(--muted);margin:0}
.meta{font-size:13px;color:var(--muted);margin-top:12px}
.theme-btn{position:absolute;top:44px;right:0;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:15px}
section{margin-top:28px}
h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:20px;background:var(--accent);border-radius:2px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box ul{margin:0;padding-left:18px}.box li{margin:4px 0}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.log{list-style:none;padding:0;margin:10px 0 0}.log li{font-size:14px;margin:4px 0}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--text);margin-right:6px;vertical-align:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:10px;color:var(--muted)}
.s3{color:var(--red)}.s2{color:var(--yellow)}.s1{color:var(--gray)}
/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tab{flex:0 0 auto;background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.route-desc{color:var(--muted);font-size:14px;margin:12px 0}
/* progress */
.progress{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--done));width:0;transition:width .3s}
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.group{font-size:13px;font-weight:700;color:var(--accent2);margin:22px 0 8px -26px;padding-left:26px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;transition:opacity .2s,border-color .2s}
.card::before{content:"";position:absolute;left:-22px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.card.done{opacity:.55}.card.done::before{background:var(--done);border-color:var(--done)}
.card.final{border-color:var(--accent)}
.card.todo{border-style:dashed;background:transparent}
.card.todo::before{border-color:var(--gray)}
.card.flash{border-color:var(--yellow);box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 30%,transparent)}
.num{font-weight:800;color:var(--accent);min-width:26px;font-size:15px}
.body{flex:1;min-width:0}
.thumb{display:block;width:100%;max-width:360px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:8px;background:var(--bg2)}
.ttl{font-weight:600}
.tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.t-main{background:#2a5bd7;color:#fff}.t-event{background:#8a4bd6;color:#fff}.t-final{background:var(--accent);color:#fff}.t-todo{background:var(--gray);color:#fff}
.stars{font-size:13px;letter-spacing:1px}
.notes{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}
.chk{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;cursor:pointer;flex:0 0 auto;margin-top:2px;display:grid;place-content:center}
.chk:checked{background:var(--done);border-color:var(--done)}
.chk:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.end{text-align:center;color:var(--muted);margin:26px 0 0;font-size:14px}
.end b{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:20px}
.refs a{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none}
.refs a:last-child{border:none}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:600px){.theme-btn{top:16px}header{padding-top:56px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">BLUE ARCHIVE · 비공식 팬 가이드</span>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="meta">최종 업데이트 <span id="updated"></span> · <a id="src" target="_blank" rel="noopener"></a></div>
    <button class="theme-btn" id="themeBtn" aria-label="테마 전환">☾</button>
    <details style="margin-top:14px"><summary>업데이트 로그</summary><ul class="log" id="log"></ul></details>
  </header>

  <section>
    <h2>먼저 알아둘 점</h2>
    <div class="box">
      <ul id="notice"></ul>
      <div class="legend">
        <span><span class="s3">★★★</span> 필수급</span>
        <span><span class="s2">★★</span> 보는 게 좋음</span>
        <span><span class="s1">★</span> 선택</span>
      </div>
    </div>
  </section>

  <section>
    <h2>스토리 순서</h2>
    <div class="tabs" id="tabs"></div>
    <p class="route-desc" id="routeDesc"></p>
    <div class="progress">
      <div class="bar"><i id="barFill"></i></div>
      <span id="progText" style="font-size:13px;color:var(--muted)"></span>
      <button class="btn primary" id="continueBtn">이어보기 ▶</button>
      <button class="btn" id="resetBtn">초기화</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="timeline" id="timeline"></div>
    <p class="end" id="endMark"></p>
  </section>

  <section>
    <h2>참고 자료</h2>
    <div class="box refs" id="refs"></div>
  </section>

  <footer>
    본 페이지는 개인이 정리한 비공식 가이드이며, 패치에 따라 내용이 달라질 수 있습니다.
    블루 아카이브의 모든 권리는 NEXON Games / Yostar에 있습니다.
    시청 체크는 이 브라우저에만 저장됩니다.
  </footer>
</div>

<script src="data.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = window.SITE, R = window.ROUTES;
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // header
  $("title").textContent = S.title;
  $("subtitle").textContent = S.subtitle;
  $("updated").textContent = S.updated;
  $("src").textContent = S.source.label; $("src").href = S.source.url;
  $("log").innerHTML = S.changelog.map(l => `<li>${l.date} <span class="tag">${l.tag}</span>${l.text}</li>`).join("");
  $("notice").innerHTML = S.notice.map(n => `<li>${n}</li>`).join("");
  $("refs").innerHTML = (window.REFERENCES||[]).map(r => `<a href="${r.url}" target="_blank" rel="noopener">${r.title} ↗</a>`).join("");

  // theme
  const applyTheme = t => { document.documentElement.dataset.theme = t; $("themeBtn").textContent = t === "light" ? "☾" : "☀"; };
  applyTheme(store.get("ba-theme", "dark"));
  $("themeBtn").onclick = () => { const t = document.documentElement.dataset.theme === "light" ? "dark" : "light"; store.set("ba-theme", t); applyTheme(t); };

  // state
  let routeId = store.get("ba-route", R[0].id);
  if (!R.find(r => r.id === routeId)) routeId = R[0].id;
  let watched = store.get("ba-watched", {});   // key: title → true (공유: 같은 제목은 모든 루트에서 체크)
  let filter = "all";

  const FILTERS = [
    ["all","전체"],["unwatched","안 본 것"],["imp3","필수급만"],["main","메인"],["event","이벤트"]
  ];
  $("filters").innerHTML = FILTERS.map(([k,l]) => `<button class="chip" data-f="${k}">${l}</button>`).join("");
  $("filters").onclick = e => { const f = e.target.dataset.f; if (!f) return; filter = f; render(); };

  $("tabs").innerHTML = R.map(r => `<button class="tab" data-r="${r.id}">${r.short}</button>`).join("");
  $("tabs").onclick = e => { const r = e.target.dataset.r; if (!r) return; routeId = r; store.set("ba-route", r); render(); };

  const typeLabel = { main:"메인", event:"이벤트", final:"최종편", todo:"작성 필요" };
  const stars = n => n ? `<span class="stars s${n}">${"★".repeat(n)}</span>` : "";
  const pass = it => {
    if (filter === "unwatched") return !watched[it.title] && it.type !== "todo";
    if (filter === "imp3") return it.imp === 3;
    if (filter === "main") return it.type === "main" || it.type === "final";
    if (filter === "event") return it.type === "event";
    return true;
  };

  function render(){
    const route = R.find(r => r.id === routeId);
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.r === routeId));
    document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
    $("routeDesc").textContent = route.name + " — " + route.desc;

    let n = 0, html = "", pendingGroup = null, shown = 0;
    route.items.forEach((it, i) => {
      if (it.group) { pendingGroup = it.group; return; }
      if (it.type !== "todo") n++;
      if (!pass(it)) return;
      if (pendingGroup) { html += `<div class="group">${pendingGroup}</div>`; pendingGroup = null; }
      shown++;
      const done = !!watched[it.title];
      const notes = it.notes ? `<ul class="notes">${it.notes.map(x=>`<li>${x}</li>`).join("")}</ul>` : "";
      html += `<div class="card ${it.type} ${done?"done":""}" id="c-${i}">
        ${it.type === "todo" ? `<span class="num">…</span>` : `<span class="num">${String(n).padStart(2,"0")}</span>`}
        <div class="body">
          ${it.img ? `<img class="thumb" src="${it.img}" alt="" loading="lazy" onerror="this.remove()">` : ""}
          <div class="ttl">${it.title}</div>
          <div class="tags"><span class="tag t-${it.type}">${typeLabel[it.type]}</span>${stars(it.imp)}</div>
          ${notes}
        </div>
        ${it.type === "todo" ? "" : `<input type="checkbox" class="chk" data-t="${encodeURIComponent(it.title)}" ${done?"checked":""} aria-label="봤어요">`}
      </div>`;
    });
    $("timeline").innerHTML = shown ? html : `<div class="empty">조건에 맞는 스토리가 없어요.</div>`;
    $("endMark").innerHTML = routeId === "main1" ? "<b>— 1부 완결 —</b>" : "";

    const real = route.items.filter(it => !it.group && it.type !== "todo");
    const cnt = real.filter(it => watched[it.title]).length;
    $("barFill").style.width = (real.length ? cnt / real.length * 100 : 0) + "%";
    $("progText").textContent = `${cnt} / ${real.length} 감상`;
  }

  $("timeline").addEventListener("change", e => {
    if (!e.target.classList.contains("chk")) return;
    const t = decodeURIComponent(e.target.dataset.t);
    if (e.target.checked) watched[t] = true; else delete watched[t];
    store.set("ba-watched", watched); render();
  });

  $("continueBtn").onclick = () => {
    if (filter !== "all") { filter = "all"; render(); }
    const route = R.find(r => r.id === routeId);
    const idx = route.items.findIndex(it => !it.group && it.type !== "todo" && !watched[it.title]);
    if (idx < 0) { alertless("이 루트는 모두 감상했어요! 🎉"); return; }
    const el = $("c-" + idx); el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500);
  };
  $("resetBtn").onclick = () => {
    const route = R.find(r => r.id === routeId);
    route.items.forEach(it => { if (it.title) delete watched[it.title]; });
    store.set("ba-watched", watched); render();
  };
  function alertless(msg){ $("progText").textContent = msg; }

  render();
})();
</script>
</body>
</html>
